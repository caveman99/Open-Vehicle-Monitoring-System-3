name: Build OVMS V3 firmware

# Manual on-demand build for the OVMS V3 ESP32 firmware.
# Follows the documented "Build It Yourself" procedure:
#   - openvehicles/esp-idf master (the OVMS-patched ESP-IDF v3.3 fork)
#   - vehicle/OVMS.V3/support/sdkconfig.default.hw31 as the v3.3 hardware config
#   - legacy GNU make build
#
# Run via the Actions tab > "Build OVMS V3 firmware" > "Run workflow".
# Builds the branch selected in the dropdown, or the branch/tag/SHA given in
# the "branch" input (that ref does not need to contain this workflow).
# Optionally override the ESP-IDF ref.
#
# Note on runtime: we deliberately do NOT use the espressif/idf:release-v3.3
# container. That image is Ubuntu 18.04 / glibc 2.27, and current GitHub
# actions ship Node 20 binaries that require glibc >= 2.28. We instead run
# on the host runner and install the v3.3-era xtensa toolchain manually.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "OVMS branch / tag / SHA to build. Empty = the branch selected above."
        required: false
        default: ""
      esp_idf_ref:
        description: "openvehicles/esp-idf ref (branch / tag / full SHA). Default = production HEAD (v3.3.4-854-g9063c8662)."
        required: false
        default: "9063c8662ca5d67b5490c1503bd4377b380feed3"

env:
  BUILD_REF: ${{ inputs.branch || github.ref_name }}
  OVMS_ESP_IDF_REPO: https://github.com/openvehicles/esp-idf.git
  # xtensa-esp32-elf gcc 5.2.0 (crosstool-ng-1.22.0-97-gc752ad5) — the
  # exact toolchain pinned by tools/toolchain_versions.mk in the
  # openvehicles/esp-idf fork. Newer toolchains (gcc 8.x / esp-2021r2)
  # ship a newlib that uses BSD-style attribute macros (__result_use_check
  # etc.) which the v3.3.4-era IDF source does not pull in correctly,
  # producing "expected initializer before '__result_use_check'" errors
  # in <stdlib.h> when asio/std::cstdlib is compiled.
  XTENSA_TOOLCHAIN_URL: https://dl.espressif.com/dl/xtensa-esp32-elf-linux64-1.22.0-97-gc752ad5-5.2.0.tar.gz
  # Silences any "press <enter> to continue" prompts in v3.3 make targets.
  BATCH_BUILD: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OVMS (with submodules)
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BUILD_REF }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git wget curl flex bison gperf \
            cmake ninja-build ccache \
            libffi-dev libssl-dev dfu-util libusb-1.0-0 \
            python3 python3-pip python3-venv python3-setuptools \
            dos2unix perl

      - name: Install xtensa-esp32-elf toolchain (gcc 8.4.0)
        run: |
          set -euo pipefail
          curl -fsSL "$XTENSA_TOOLCHAIN_URL" -o "$RUNNER_TEMP/xtensa.tar.gz"
          tar -xzf "$RUNNER_TEMP/xtensa.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xtensa-esp32-elf/bin" >> "$GITHUB_PATH"

      - name: Clone OVMS-patched ESP-IDF
        run: |
          set -euo pipefail
          IDF_DIR="$GITHUB_WORKSPACE/.esp-idf"
          git clone --no-checkout "$OVMS_ESP_IDF_REPO" "$IDF_DIR"
          git -C "$IDF_DIR" checkout "${{ inputs.esp_idf_ref }}"
          git -C "$IDF_DIR" submodule update --init --recursive
          echo "IDF_PATH=$IDF_DIR" >> "$GITHUB_ENV"

      - name: Install ESP-IDF Python requirements
        run: |
          set -euo pipefail
          python3 -m pip install --user --upgrade pip wheel
          # v3.3-era requirements installed verbatim from the IDF tree
          if [ -f "$IDF_PATH/requirements.txt" ]; then
            python3 -m pip install --user -r "$IDF_PATH/requirements.txt"
          else
            # Fallback if requirements.txt is missing in this ref
            python3 -m pip install --user pyserial cryptography future pyparsing pyelftools
          fi
          # Make ~/.local/bin entries (e.g. esptool wrappers) visible
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain and IDF revision
        run: |
          echo "IDF_PATH=$IDF_PATH"
          git -C "$IDF_PATH" describe --always --dirty || true
          git -C "$IDF_PATH" rev-parse HEAD
          xtensa-esp32-elf-gcc --version | head -n 1
          python3 --version

      - name: Configure (hw31 default sdkconfig)
        working-directory: vehicle/OVMS.V3
        run: |
          set -euo pipefail
          cp support/sdkconfig.default.hw31 sdkconfig
          # Resolve any new Kconfig items introduced since the snapshot,
          # using their declared defaults (non-interactive).
          make defconfig

      - name: Build firmware
        working-directory: vehicle/OVMS.V3
        run: make -j"$(nproc)"

      - name: Record build provenance
        if: always()
        working-directory: vehicle/OVMS.V3
        run: |
          set -eu
          mkdir -p build
          echo "ARTIFACT_NAME=ovms3-${BUILD_REF//\//-}-${{ github.run_number }}" >> "$GITHUB_ENV"
          {
            echo "ovms_branch=$BUILD_REF"
            echo "ovms_sha=$(git rev-parse HEAD)"
            echo "ovms_describe=$(git describe --always --tags --dirty 2>/dev/null || git rev-parse --short HEAD)"
            echo "esp_idf_repo=$OVMS_ESP_IDF_REPO"
            echo "esp_idf_ref_input=${{ inputs.esp_idf_ref }}"
            echo "esp_idf_sha=$(git -C "$IDF_PATH" rev-parse HEAD)"
            echo "esp_idf_describe=$(git -C "$IDF_PATH" describe --always --dirty 2>/dev/null || true)"
          } > build/build-info.txt
          cp sdkconfig build/sdkconfig.used || true

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error
          path: |
            vehicle/OVMS.V3/build/ovms3.bin
            vehicle/OVMS.V3/build/ovms3.elf
            vehicle/OVMS.V3/build/ovms3.map
            vehicle/OVMS.V3/build/partitions.bin
            vehicle/OVMS.V3/build/bootloader/bootloader.bin
            vehicle/OVMS.V3/build/ota_data_initial.bin
            vehicle/OVMS.V3/build/build-info.txt
            vehicle/OVMS.V3/build/sdkconfig.used
